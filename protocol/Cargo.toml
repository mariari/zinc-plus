[package]
name = "zinc-protocol"
publish = false
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
crypto-primitives = { workspace = true }
rayon = { workspace = true, optional = true }
itertools = { workspace = true }
num-traits = { workspace = true }
thiserror = { workspace = true }
zip-plus = { workspace = true }
zinc-piop = { workspace = true }
zinc-poly = { workspace = true }
zinc-primality = { workspace = true }
zinc-transcript = { workspace = true }
zinc-uair = { workspace = true }
zinc-utils = { workspace = true }

[lib]
bench = false

[dev-dependencies]
criterion = { workspace = true }
crypto-bigint = { workspace = true }
rand = { workspace = true }
zinc-test-uair = { workspace = true }
zstd = "0.13"
libc = "0.2"

[lints]
workspace = true


[features]
parallel = [
    "dep:rayon",
    "zinc-piop/parallel",
    "zinc-poly/parallel",
    "zinc-uair/parallel",
    "zinc-utils/parallel",
    "zip-plus/parallel",
]
simd = ["zinc-poly/simd", "zinc-piop/simd", "zip-plus/simd"]
unchecked = []
# Switch the IPRS bench code from inverse-rate 4 (rate 1/4) to inverse-rate 8
# (rate 1/8). Affects every `IprsCode<..., REP, ...>` instance in `benches/e2e.rs`.
iprs-rate-1-8 = []
# Switch the IPRS bench code to inverse-rate 16 (rate 1/16). Takes precedence
# over `iprs-rate-1-8` if both are enabled.
iprs-rate-1-16 = []
# Target security level of the tests/benches (default 100 bits). Sets the
# number of Zip+ column openings for the chosen rate (see
# `zip_plus::pcs::structs::num_column_openings`) and, in the benches that
# draw the projecting prime from the transcript, the prime's width.
# `sec-128` takes precedence over `sec-114` if both are enabled.
sec-114 = []
sec-128 = []

[[bench]]
name = "e2e"
harness = false

[[bench]]
name = "limber_multiswap"
harness = false
